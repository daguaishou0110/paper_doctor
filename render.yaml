# Render Blueprint — 决策台静态站
# 文档: https://render.com/docs/static-sites
services:
  - type: web
    name: multi-cancer-desk
    runtime: static
    buildCommand: ""
    staticPublishPath: .
    # Do NOT rewrite /* → index.html: that can break static assets on some setups.
    # This site uses in-page JS navigation, not path-based SPA routes.
