# Render Blueprint — 决策台静态站
# 文档: https://render.com/docs/static-sites
services:
  - type: web
    name: multi-cancer-desk
    runtime: static
    # 若仓库根目录就是 website/ 内容，保持如下：
    buildCommand: ""
    staticPublishPath: .
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
